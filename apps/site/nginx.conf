# OptiRelay showcase — nginx of the `orp-site` image.
#
#   /                the showcase
#   /protocol/       Web presentation of the ORP protocol and of the TM4 / TM8 modes
#   /studio/         OptiRelay Studio, interactive demo on the npm packages
#   /lab/            withdrawn: redirected to /studio/, which replaces the bench
#   /app/            withdrawn: redirected to /studio/ (sw.js there purges the former PWA)
#   /download/       the Android APK and its digest (/telecharger/ redirects there)
#
# TLS is terminated by the stack's Caddy (LeLab-infra): this nginx speaks
# plain HTTP on the project network, never exposed.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    # RELATIVE redirects: behind the TLS terminator, nginx only sees http on
    # port 80 and would build `http://…/lab/` — the browser would leave HTTPS,
    # hence the camera and WebCrypto.
    absolute_redirect off;

    # The camera and WebCrypto only exist in a secure context: the stack
    # terminates HTTPS. The camera is allowed for THIS origin only.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # Everything comes from this origin: scripts, styles, fonts. `blob:` for
    # the preview of received images, `data:` for the empty poster of <video>.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # `/studio` without a trailing slash: the relative paths of the bundle
    # (base "./") are wrong without it.
    location = /studio { return 301 /studio/; }
    # The bench is replaced by the Studio: links already shared land there.
    location = /lab { return 301 /studio/; }
    location /lab/ { return 301 /studio/; }
    location = /app { return 301 /studio/; }
    location = /protocol { return 301 /protocol/; }

    # Missing paths get the showcase's own 404 page (status kept at 404); it
    # cannot be requested directly.
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Fingerprinted files (Vite): immutable.
    location ~ ^/(studio/)?assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # The application is no longer served: only the Studio remains. Browsers
    # that had opened it keep its service worker, which would serve its cached
    # copy forever; they recheck /app/sw.js on each visit and find a PURGE
    # service worker there (caches emptied, unregistration, redirect to
    # /studio/). The rest of /app/ redirects to the Studio.
    location = /app/sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
    location /app/ { return 301 /studio/; }

    # Former French route of the downloads: links already shared keep working.
    location = /telecharger { return 301 /download/; }
    location /telecharger/ {
        rewrite ^/telecharger/(.*)$ /download/$1 permanent;
    }
    location = /download { return 301 /download/; }

    location /download/ {
        types {
            application/vnd.android.package-archive apk;
            application/json json;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        location ~ \.apk$ {
            add_header Content-Disposition 'attachment; filename="optirelay.apk"' always;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }
}
