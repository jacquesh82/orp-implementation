[package]
name = "optirelay"
description = "OptiRelay — optical screen → camera transfer, native app (Slint)"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
# cdylib: the library loaded by the Android native activity.
crate-type = ["lib", "cdylib"]

[[bin]]
name = "optirelay"
path = "src/main.rs"

[dependencies]
slint = "1.18"
serde_json = "1"
orp-core = { path = "../crates/orp-core" }
orp-optics = { path = "../crates/orp-optics" }
orp-transfer = { path = "../crates/orp-transfer" }
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", features = ["backend-android-activity-06"] }
jni = "0.21"
ndk-context = "0.1"
ndk-sys = { version = "0.6", features = ["media"] }

[build-dependencies]
slint-build = "1.18"

[package.metadata.android]
package = "fr.lelab.optirelay.natif"
apk_name = "optirelay-natif"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.application]
label = "OptiRelay"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

